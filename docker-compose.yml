services:
  print-queue-manager:
    build:
      context: .
    container_name: print-queue-manager
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID}
      - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET}
      - AUTHENTIK_METADATA_URL=${AUTHENTIK_METADATA_URL}
      - PRINTER_NAME=${PRINTER_NAME:-HP_Smart_Tank_515}
      - CUPS_SERVER=127.0.0.1:631
      - CUPS_USER=${CUPS_USER:-print}
      - CUPS_PASSWORD=${CUPS_PASSWORD:-print}
      - ADMIN_GROUPS=${ADMIN_GROUPS:-admins,print-admins}
      - ADMIN_USERS=${ADMIN_USERS:-admin}
      - DATABASE_PATH=data/printqueue.db
      - UPLOAD_FOLDER=data/uploads
      - OFFICE_FOLDER=data/office
      # Collabora Online / WOPI office editor
      - COLLABORA_ENABLED=${COLLABORA_ENABLED:-true}
      - COLLABORA_URL=${COLLABORA_URL:-https://office.toonshou.in}
      - COLLABORA_INTERNAL_URL=${COLLABORA_INTERNAL_URL:-http://172.16.0.9:9980}
      - COLLABORA_VERIFY_TLS=${COLLABORA_VERIFY_TLS:-true}
      - WOPI_PUBLIC_URL=${WOPI_PUBLIC_URL:-}
      - WOPI_TOKEN_TTL=${WOPI_TOKEN_TTL:-14400}
      # Email Print (optional)
      - MAIL_ENABLED=${MAIL_ENABLED:-false}
      - MAIL_IMAP_HOST=${MAIL_IMAP_HOST:-}
      - MAIL_IMAP_PORT=${MAIL_IMAP_PORT:-993}
      - MAIL_IMAP_USER=${MAIL_IMAP_USER:-}
      - MAIL_IMAP_PASS=${MAIL_IMAP_PASS:-}
      - MAIL_IMAP_FOLDER=${MAIL_IMAP_FOLDER:-INBOX}
      - MAIL_SMTP_HOST=${MAIL_SMTP_HOST:-}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-587}
      - MAIL_SMTP_USER=${MAIL_SMTP_USER:-}
      - MAIL_SMTP_PASS=${MAIL_SMTP_PASS:-}
      # Active Directory (LDAP)
      - LDAP_ENABLED=${LDAP_ENABLED:-false}
      - LDAP_SHOW_IN_WEBUI=${LDAP_SHOW_IN_WEBUI:-true}
      - LDAP_HOST=${LDAP_HOST:-}
      - LDAP_PORT=${LDAP_PORT:-389}
      - LDAP_USE_SSL=${LDAP_USE_SSL:-false}
      - LDAP_BASE_DN=${LDAP_BASE_DN:-}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
      - LDAP_DOMAIN=${LDAP_DOMAIN:-}
      - LDAP_USER_SEARCH_FILTER=${LDAP_USER_SEARCH_FILTER:-(&(objectClass=user)(sAMAccountName={username}))}
      # Claim system
      - UNCLAIMED_JOB_TIMEOUT=${UNCLAIMED_JOB_TIMEOUT:-24}
    depends_on:
      cups:
        condition: service_healthy
    network_mode: host

  cups:
    build:
      context: .
      dockerfile: Dockerfile.cups
    container_name: cups-server
    restart: unless-stopped
    volumes:
      - cups-data:/etc/cups
      - ./config/cupsd.conf:/etc/cups/cupsd.conf:ro
      - ./ppd:/usr/share/cups/model
      - ./config/avahi:/etc/avahi/services # AirPrint service files
    environment:
      - CUPS_USER=${CUPS_USER:-print}
      - CUPS_PASSWORD=${CUPS_PASSWORD:-print}
      - PRINTER_NAME=${PRINTER_NAME:-HP_Smart_Tank_515}
      # Active Directory / LDAP — enables AD auth for IPP printing (Android/iOS)
      - LDAP_ENABLED=${LDAP_ENABLED:-false}
      - LDAP_HOST=${LDAP_HOST:-}
      - LDAP_PORT=${LDAP_PORT:-389}
      - LDAP_USE_SSL=${LDAP_USE_SSL:-false}
      - LDAP_BASE_DN=${LDAP_BASE_DN:-}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
    healthcheck:
      test: ["CMD", "lpstat", "-r"]
      interval: 10s
      timeout: 5s
      retries: 6
    network_mode: host

volumes:
  cups-data:
    driver: local
