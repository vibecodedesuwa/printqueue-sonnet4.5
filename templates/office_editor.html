<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ document.name }} — PrintQ Office</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { font-family: Inter, 'Noto Sans Thai', Tahoma, sans-serif; background: #0a0a14; color: #eaeaf2; }
        .office-shell { height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
        .office-bar { background: #12121f; border-bottom: 1px solid rgba(124,111,255,.22); padding: 8px 12px; }
        .document-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #collaboraFrame { width: 100%; height: 100%; border: 0; background: #fff; }
        .btn:focus-visible, input:focus-visible { outline: 3px solid rgba(167,139,250,.75); outline-offset: 2px; }
        @media (max-width: 600px) {
            .office-bar { align-items: stretch !important; }
            .print-controls { width: 100%; }
            .print-controls .btn { flex: 1; }
        }
    </style>
</head>
<body>
<div class="office-shell">
    <header class="office-bar d-flex flex-wrap align-items-center gap-2">
        <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('web.editor_page') }}" aria-label="Back to documents"><i class="bi bi-arrow-left"></i></a>
        <strong class="document-name flex-grow-1" title="{{ document.name }}"><i class="bi bi-file-earmark-text text-info me-1"></i>{{ document.name }}</strong>
        {% if not error %}
        <div class="print-controls d-flex align-items-center gap-2">
            <label class="visually-hidden" for="officeCopies">Copies</label>
            <input id="officeCopies" class="form-control form-control-sm text-center" type="number" min="1" max="99" value="1" inputmode="numeric" style="width:64px">
            <button type="button" class="btn btn-success btn-sm" id="savePrintBtn"><i class="bi bi-printer-fill me-1"></i><span id="savePrintLabel">Save & Print</span></button>
        </div>
        {% endif %}
    </header>

    {% if error %}
    <main class="d-flex align-items-center justify-content-center p-4">
        <div class="alert alert-danger" role="alert"><strong>Office editor unavailable.</strong><br>{{ error }}</div>
    </main>
    {% else %}
    <main class="position-relative">
        <iframe id="collaboraFrame" name="collaboraFrame" title="Collabora Office editor for {{ document.name }}" allow="clipboard-read; clipboard-write" referrerpolicy="same-origin"></iframe>
        <form id="collaboraForm" action="{{ iframe_url }}" method="post" target="collaboraFrame">
            <input type="hidden" name="access_token" value="{{ access_token }}">
            <input type="hidden" name="access_token_ttl" value="{{ access_token_ttl }}">
        </form>
    </main>
    {% endif %}
</div>

{% if not error %}
<script>
    const officeForm = document.getElementById('collaboraForm');
    const selectedLanguage = localStorage.getItem('pq_lang') === 'th' ? 'th-TH' : 'en-US';
    document.documentElement.lang = selectedLanguage.startsWith('th') ? 'th' : 'en';
    officeForm.action += `${officeForm.action.includes('?') ? '&' : '?'}lang=${encodeURIComponent(selectedLanguage)}`;
    officeForm.submit();

    let pendingPrint = null;
    window.addEventListener('message', (event) => {
        if (event.source !== document.getElementById('collaboraFrame').contentWindow) return;
        const message = typeof event.data === 'string' ? (() => { try { return JSON.parse(event.data); } catch (_) { return {}; } })() : event.data;
        if (message?.MessageId === 'Action_Save_Resp' && pendingPrint) pendingPrint();
    });

    document.getElementById('savePrintBtn').addEventListener('click', async function () {
        const button = this;
        const label = document.getElementById('savePrintLabel');
        button.disabled = true;
        label.textContent = 'Saving…';

        let completed = false;
        const submitPrint = async () => {
            if (completed) return;
            completed = true;
            pendingPrint = null;
            label.textContent = 'Sending…';
            try {
                const form = new FormData();
                form.append('copies', document.getElementById('officeCopies').value || '1');
                const response = await fetch('{{ url_for("office.print_office_document", file_id=document.id) }}', { method: 'POST', body: form, headers: { 'Accept': 'application/json' } });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Unable to submit print job');
                label.textContent = `Queued #${data.job_id}`;
                setTimeout(() => { button.disabled = false; label.textContent = 'Save & Print'; }, 1800);
            } catch (error) {
                label.textContent = error.message;
                setTimeout(() => { button.disabled = false; label.textContent = 'Save & Print'; }, 2500);
            }
        };

        pendingPrint = submitPrint;
        document.getElementById('collaboraFrame').contentWindow.postMessage(JSON.stringify({
            MessageId: 'Action_Save',
            SendTime: Date.now(),
            Values: { DontTerminateEdit: true, DontSaveIfUnmodified: false, Notify: true }
        }), '*');
        setTimeout(submitPrint, 2500);
    });
</script>
{% endif %}
</body>
</html>
